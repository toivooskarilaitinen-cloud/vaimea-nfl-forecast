name: Update forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 4"
permissions: {contents: write}
concurrency: {group: forecast-update, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: vaimea download --season 2024 --season 2025
      - run: vaimea publish
      - name: Commit versioned public outputs
        run: |
          git config user.name "vaimea-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data data/forecast-ledger
          git diff --cached --quiet || git commit -m "data: weekly forecast update"
          git push

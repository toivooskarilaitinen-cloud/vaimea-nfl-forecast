name: Update forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
    - cron: "17 11 * * *"
permissions:
  contents: write
  issues: write
concurrency: {group: forecast-update, cancel-in-progress: false}
jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Select the cron that represents 13.17 Europe/Helsinki today
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import datetime
          import os
          from zoneinfo import ZoneInfo

          should_run = True
          if os.environ["EVENT_NAME"] == "schedule":
              helsinki = datetime.datetime.now(ZoneInfo("Europe/Helsinki"))
              utc_hour = helsinki.replace(hour=13, minute=17).astimezone(datetime.UTC).hour
              should_run = os.environ["EVENT_SCHEDULE"] == f"17 {utc_hour} * * *"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={str(should_run).lower()}\n")
          PY
  update:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: vaimea download --allow-missing --season 2018 --season 2019 --season 2020 --season 2021 --season 2022 --season 2023 --season 2024 --season 2025 --season 2026
      - run: vaimea quality-check
      - run: vaimea recover
      - run: vaimea update-season-input
      - name: Score completed official forecasts
        run: vaimea score-official
      - run: vaimea season-run
      - name: Archive changed season probabilities
        run: vaimea archive-season
      - name: Prepare the next QB review package
        run: vaimea prepare-review --final-lock-minutes 90
      - name: Record successful production heartbeat
        run: |
          python - <<'PY'
          import datetime
          import json
          from pathlib import Path

          heartbeat = {
              "status": "ok",
              "completed_at": datetime.datetime.now(datetime.UTC).isoformat(),
              "run_id": "${{ github.run_id }}",
              "commit": "${{ github.sha }}",
          }
          Path("public/data/automation-heartbeat.json").write_text(
              json.dumps(heartbeat, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Commit versioned public outputs and review package
        run: |
          git config user.name "sarka-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data data/forecast-ledger data/drafts data/operator/starter-review.json data/season-runs/input.json
          if [ -d data/season-forecast-ledger ]; then git add data/season-forecast-ledger; fi
          git diff --cached --quiet || git commit -m "data: prepare forecast review"
          git push
      - name: Notify owner when QB review is required
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const path = "public/data/review-request.json";
            if (!fs.existsSync(path)) return;
            const request = JSON.parse(fs.readFileSync(path, "utf8"));
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: "open"});
            const prefix = "SARKA QB review required:";
            const old = issues.filter(issue => issue.title.startsWith(prefix));
            if (!request.review_needed) {
              for (const issue of old) {
                await github.rest.issues.createComment({...context.repo, issue_number: issue.number, body: "No QB review is currently required. Closing this request."});
                await github.rest.issues.update({...context.repo, issue_number: issue.number, state: "closed"});
              }
              return;
            }
            const title = `${prefix} Week ${request.source_week}`;
            const rows = request.games.map(game => {
              const pct = (Number(game.home_win_probability) * 100).toFixed(1);
              const match = game.qb_probability_match ? "✅" : "⛔ recompute required";
              return `| ${game.away_team} @ ${game.home_team} | ${game.away_qb_name} / ${game.home_qb_name} | ${pct}% ${game.home_team} | ${match} |`;
            }).join("\n");
            const body = [
              "A new SARKA forecast snapshot is ready for human QB review.",
              "",
              `**Approval deadline (earliest final lock):** ${request.approval_deadline}`,
              "",
              "| Game | QB check (away / home) | Forecast | Probability QB match |",
              "|---|---|---:|---|",
              rows,
              "",
              "If every QB is correct and no row says recompute required, open:",
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/approve.yml`,
              "",
              "If a QB is wrong, open **Correct QB and recompute** first:",
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/correct-qb.yml`,
              "",
              "Run **Approve official forecast**, enter your name, and type `APPROVE`.",
              "The workflow will refuse publication after the T−90 minute final lock or if a QB no longer matches the probability calculation."
            ].join("\n");
            const existing = old.find(issue => issue.title === title);
            if (existing) {
              const packageChanged = existing.body !== body;
              await github.rest.issues.update({...context.repo, issue_number: existing.number, body, assignees: [context.repo.owner]});
              if (packageChanged) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: existing.number,
                  body: `QB review package changed at ${request.generated_at}. Please review the updated probabilities and starters before ${request.approval_deadline}.`
                });
              }
            } else {
              await github.rest.issues.create({...context.repo, title, body, assignees: [context.repo.owner]});
            }
  alert:
    if: always() && (needs.schedule-gate.result == 'failure' || needs.update.result == 'failure')
    needs: [schedule-gate, update]
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the GitHub alert issue
        uses: actions/github-script@v8
        with:
          script: |
            const title = "SARKA operational alert: forecast update failed";
            const body = [
              "The automated data, quality, recovery, preparation, or publication run failed.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              "",
              "No official forecast was overwritten. Inspect the failed step before the next approval."
            ].join("\n");
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: "open"});
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body, assignees: [context.repo.owner]});
            }

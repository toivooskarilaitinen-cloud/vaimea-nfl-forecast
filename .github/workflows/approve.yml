name: Approve official forecast
on:
  workflow_dispatch:
    inputs:
      reviewer:
        description: Reviewer name
        required: true
      confirmation:
        description: Type APPROVE after checking every listed QB
        required: true
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: official-forecast-approval
  cancel-in-progress: false
jobs:
  approve:
    environment: forecast-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Record explicit human QB approval
        env:
          REVIEWER: ${{ inputs.reviewer }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: >-
          vaimea confirm-starters
          --reviewer "$REVIEWER"
          --confirmation "$CONFIRMATION"
      - name: Run quality, QB, provenance and final-lock gates
        run: vaimea review data/drafts/latest.json data/operator/starter-review.json
      - name: Append approved forecast to immutable ledger
        env:
          REVIEWER: ${{ inputs.reviewer }}
        run: vaimea approve data/drafts/latest.json data/operator/starter-review.json "$REVIEWER"
      - run: vaimea publish
      - run: vaimea season-run
      - run: vaimea archive-season
      - name: Commit official ledger and public views
        run: |
          git config user.name "sarka-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/forecast-ledger data/operator/starter-review.json public/data
          if [ -d data/season-forecast-ledger ]; then git add data/season-forecast-ledger; fi
          git commit -m "forecast: approve official snapshot"
          git push
      - name: Publish the approved snapshot to GitHub Pages
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Close the QB review notification
        uses: actions/github-script@v8
        env:
          REVIEWER: ${{ inputs.reviewer }}
        with:
          script: |
            const fs = require("fs");
            const request = JSON.parse(fs.readFileSync("public/data/review-request.json", "utf8"));
            const title = `SARKA QB review required: Week ${request.source_week}`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: "open"});
            const issue = issues.find(item => item.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `Approved by **${process.env.REVIEWER}**. The snapshot is now in the immutable ledger. Later snapshots may still be published before each game's T−90 final lock.`
              });
              await github.rest.issues.update({...context.repo, issue_number: issue.number, state: "closed"});
            }
  alert:
    if: failure()
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = "SARKA operational alert: forecast approval failed";
            const body = `Approval run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nNo official forecast was overwritten.`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: "open"});
            const existing = issues.find(issue => issue.title === title);
            if (existing) await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body, assignees: [context.repo.owner]});
